name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Playwright - ${{ matrix.market }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        market:
          - gambia
          - uganda
          - sierraLeone

    env:
      MARKET: ${{ matrix.market }}

      GAMBIA_PHONE: ${{ secrets.GAMBIA_PHONE }}
      GAMBIA_PASSWORD: ${{ secrets.GAMBIA_PASSWORD }}

      UGANDA_PHONE: ${{ secrets.UGANDA_PHONE }}
      UGANDA_PASSWORD: ${{ secrets.UGANDA_PASSWORD }}

      SIERRA_LEONE_PHONE: ${{ secrets.SIERRA_LEONE_PHONE }}
      SIERRA_LEONE_PASSWORD: ${{ secrets.SIERRA_LEONE_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.market }}
          path: playwright-report/
          retention-days: 30