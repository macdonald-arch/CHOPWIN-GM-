name: Playwright Tests

on:
  push:
    branches: [ main, master ]

  pull_request:
    branches: [ main, master ]

  schedule:
    - cron: '0 8 * * *'
    - cron: '0 15 * * *'
    - cron: '0 20 * * *'

jobs:
  test:
    name: Playwright - ${{ matrix.market }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        market:
          - gambia
          - uganda
          - sierraLeone

    env:
      MARKET: ${{ matrix.market }}

      GAMBIA_PHONE: ${{ secrets.GAMBIA_PHONE }}
      GAMBIA_PASSWORD: ${{ secrets.GAMBIA_PASSWORD }}

      UGANDA_PHONE: ${{ secrets.UGANDA_PHONE }}
      UGANDA_PASSWORD: ${{ secrets.UGANDA_PASSWORD }}

      SIERRA_LEONE_PHONE: ${{ secrets.SIERRA_LEONE_PHONE }}
      SIERRA_LEONE_PASSWORD: ${{ secrets.SIERRA_LEONE_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        id: playwright
        continue-on-error: true
        run: npx playwright test

      - name: Upload Playwright JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.market }}
          path: test-results/playwright-results.json
          retention-days: 30

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.market }}
          path: playwright-report/
          retention-days: 30

      - name: Fail market job if tests failed
        if: steps.playwright.outcome == 'failure'
        run: exit 1

  slack-report:
    name: Slack Playwright Report
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - name: Download Playwright JSON results
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-results-*
          path: playwright-results
          merge-multiple: false

      - name: Build Slack report
        id: report
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const markets = {
            gambia: {
              name: 'Gambia',
              file: 'playwright-results/playwright-results-gambia/playwright-results.json'
            },
            uganda: {
              name: 'Uganda',
              file: 'playwright-results/playwright-results-uganda/playwright-results.json'
            },
            sierraLeone: {
              name: 'Sierra Leone',
              file: 'playwright-results/playwright-results-sierraLeone/playwright-results.json'
            }
          };

          function collectSpecs(suites, specs = []) {
            for (const suite of suites || []) {
              if (Array.isArray(suite.specs)) {
                specs.push(...suite.specs);
              }

              collectSpecs(suite.suites, specs);
            }

            return specs;
          }

          function analyse(file) {
            if (!fs.existsSync(file)) {
              throw new Error(`Playwright result file not found: ${file}`);
            }

            const report = JSON.parse(
              fs.readFileSync(file, 'utf8')
            );

            const specs = collectSpecs(report.suites);

            let passed = 0;
            let failed = 0;
            let skipped = 0;
            let timedOut = 0;
            let flaky = 0;

            for (const spec of specs) {
              const test = spec.tests?.[0];

              if (!test) {
                continue;
              }

              const results = test.results || [];

              const hasTimeout = results.some(
                result => result.status === 'timedOut'
              );

              if (test.status === 'skipped') {
                skipped++;
              } else if (test.status === 'flaky') {
                flaky++;
              } else if (hasTimeout) {
                timedOut++;
              } else if (test.status === 'unexpected') {
                failed++;
              } else if (test.status === 'expected') {
                passed++;
              }
            }

            const duration = report.stats?.duration || 0;

            const status =
              failed === 0 &&
              timedOut === 0 &&
              skipped === 0 &&
              flaky === 0
                ? 'PASSED'
                : 'FAILED';

            return {
              passed,
              failed,
              skipped,
              timedOut,
              flaky,
              duration,
              status
            };
          }

          function formatDuration(milliseconds) {
            const totalSeconds = Math.round(milliseconds / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;

            if (minutes === 0) {
              return `${seconds}s`;
            }

            return `${minutes}m ${seconds}s`;
          }

          const results = {};

          for (const [key, market] of Object.entries(markets)) {
            results[key] = {
              name: market.name,
              ...analyse(market.file)
            };

            results[key].durationFormatted =
              formatDuration(results[key].duration);
          }

          const all = Object.values(results);

          const passed = all.reduce(
            (sum, result) => sum + result.passed,
            0
          );

          const failed = all.reduce(
            (sum, result) => sum + result.failed,
            0
          );

          const skipped = all.reduce(
            (sum, result) => sum + result.skipped,
            0
          );

          const timedOut = all.reduce(
            (sum, result) => sum + result.timedOut,
            0
          );

          const flaky = all.reduce(
            (sum, result) => sum + result.flaky,
            0
          );

          const duration = all.reduce(
            (sum, result) => sum + result.duration,
            0
          );

          const overall =
            failed === 0 &&
            timedOut === 0 &&
            skipped === 0 &&
            flaky === 0
              ? 'PASSED'
              : 'FAILED';

          function marketMessage(result) {
            const status =
              result.status === 'PASSED'
                ? '🟢 PASSED'
                : '🔴 FAILED';

            return (
              `${status} | ` +
              `Passed: ${result.passed} | ` +
              `Failed: ${result.failed} | ` +
              `Skipped: ${result.skipped} | ` +
              `Timed Out: ${result.timedOut} | ` +
              `Flaky: ${result.flaky} | ` +
              `Duration: ${result.durationFormatted}`
            );
          }

          const githubOutput = process.env.GITHUB_OUTPUT;

          fs.appendFileSync(
            githubOutput,
            `overall=${overall}\n`
          );

          fs.appendFileSync(
            githubOutput,
            `passed=${passed}\n`
          );

          fs.appendFileSync(
            githubOutput,
            `failed=${failed}\n`
          );

          fs.appendFileSync(
            githubOutput,
            `skipped=${skipped}\n`
          );

          fs.appendFileSync(
            githubOutput,
            `timedOut=${timedOut}\n`
          );

          fs.appendFileSync(
            githubOutput,
            `flaky=${flaky}\n`
          );

          fs.appendFileSync(
            githubOutput,
            `duration=${formatDuration(duration)}\n`
          );

          fs.appendFileSync(
            githubOutput,
            `gambia=${marketMessage(results.gambia)}\n`
          );

          fs.appendFileSync(
            githubOutput,
            `uganda=${marketMessage(results.uganda)}\n`
          );

          fs.appendFileSync(
            githubOutput,
            `sierra_leone=${marketMessage(results.sierraLeone)}\n`
          );

          console.log(
            JSON.stringify(
              {
                overall,
                passed,
                failed,
                skipped,
                timedOut,
                flaky,
                duration: formatDuration(duration),
                markets: results
              },
              null,
              2
            )
          );
          NODE

      - name: Send report to Slack
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "PLAYWRIGHT TEST REPORT - LIVE",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "PLAYWRIGHT TEST REPORT"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Environment:*\nLIVE"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Overall:*\n${{ steps.report.outputs.overall == 'PASSED' && '🟢 PASSED' || '🔴 FAILED' }}"
                    }
                  ]
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Test Summary*"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Passed:*\n${{ steps.report.outputs.passed }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Failed:*\n${{ steps.report.outputs.failed }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Skipped:*\n${{ steps.report.outputs.skipped }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Timed Out:*\n${{ steps.report.outputs.timedOut }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Flaky:*\n${{ steps.report.outputs.flaky }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Duration:*\n${{ steps.report.outputs.duration }}"
                    }
                  ]
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Market Results*"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Gambia*\n${{ steps.report.outputs.gambia }}"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Uganda*\n${{ steps.report.outputs.uganda }}"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Sierra Leone*\n${{ steps.report.outputs.sierra_leone }}"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Run"
                      },
                      "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    },
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Reports"
                      },
                      "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "Branch: `${{ github.ref_name }}` • Commit: `${{ github.sha }}`"
                    }
                  ]
                }
              ]
            }